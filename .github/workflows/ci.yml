name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "feature/*" ]

jobs:
  test-and-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v -cover ./...

      - name: Run Build
        run: go build -v ./...
